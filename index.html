<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordine di Iniziativa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: due colonne (personaggi | ordine di turno con i comandi sopra) che si impilano su telefono */
:root{
  --bg:#eef0f4; --surface:#ffffff; --fg:#1c2230; --muted:#5c6577; --line:#d4d9e2;
  --accent:#9a6b1e; --accent-ink:#ffffff; --active:#fff4dc; --tie:#e9eef8; --done:#f4f5f8;
  --hero:#2f6b8f; --hero-bg:#e3eef5; --enemy:#a33a3a; --enemy-bg:#f7e4e4;
  --logo-bg:#ffffff; --logo-ink:#111111;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151922; --surface:#1e2330; --fg:#e8eaf0; --muted:#9aa3b5; --line:#343b4a;
    --accent:#d9a84a; --accent-ink:#1a1408; --active:#2e2715; --tie:#222b3c; --done:#1a1e28;
    --hero:#7fb6d8; --hero-bg:#1d2d3a; --enemy:#e07a7a; --enemy-bg:#3a2222; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151922; --surface:#1e2330; --fg:#e8eaf0; --muted:#9aa3b5; --line:#343b4a;
  --accent:#d9a84a; --accent-ink:#1a1408; --active:#2e2715; --tie:#222b3c; --done:#1a1e28;
  --hero:#7fb6d8; --hero-bg:#1d2d3a; --enemy:#e07a7a; --enemy-bg:#3a2222; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-inline:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(1.5rem,3.5vw,2.1rem);letter-spacing:.02em}
h2{font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;max-width:560px;flex:1 1 280px}
.logo-box{display:flex;flex-direction:column;align-items:center;gap:0;width:100%;background:var(--logo-bg);border-radius:12px;padding:10px 14px 12px}
.logo{display:block;width:100%;max-width:100%;height:auto}
.tools{font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:.35em;text-transform:uppercase;color:var(--logo-ink);margin:0;padding-left:.35em}
.tools.big{font-size:clamp(1.4rem,4vw,2.2rem);margin-top:6px}

/* Schermata iniziale */
.splash{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;cursor:pointer}
.splash-box{display:flex;flex-direction:column;align-items:center;width:min(92vw,720px)}
@media (prefers-reduced-motion:no-preference){
  .splash{transition:opacity .5s ease}
  .splash.out{opacity:0}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .splash-box{animation:rise .6s ease-out both}
}
.round{display:flex;align-items:baseline;gap:8px}
.round b{font-family:var(--display);font-size:1.9rem;line-height:1;color:var(--accent)}
.round .reset{min-height:28px;padding:2px 8px;font-size:.8rem;font-weight:600;border-radius:999px;color:var(--muted);margin-left:4px}
.round .reset:hover{color:var(--accent)}

/* Finestra di conferma */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:24px}
.modal-box{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:22px 20px;width:min(100%,380px);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal-box .face{font-size:3rem;line-height:1;margin-bottom:10px}
.modal-box h3{font-family:var(--body);font-size:1.1rem;margin-bottom:6px}
.modal-box p{margin:0 0 18px;color:var(--muted)}
.modal-box .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.modal-box .btns button{min-width:120px}
button.del{background:var(--enemy);border-color:var(--enemy);color:#fff}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px;cursor:pointer;min-height:42px;user-select:none;-webkit-user-select:none}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
button.icon{padding:6px 9px;min-height:34px;line-height:1}
button.danger{color:var(--enemy)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
section{min-width:0}
section h2{margin-bottom:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}

/* Eroe / Nemico */
.kind{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.kind.hero{color:var(--hero);background:var(--hero-bg)}
.kind.enemy{color:var(--enemy);background:var(--enemy-bg)}
button.kind{min-height:0;cursor:pointer}
button.kind:hover{border-color:currentColor}

/* Elenco personaggi */
.char-list{display:flex;flex-direction:column;gap:8px}
.char{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 10px;align-items:center;padding:10px 12px}
.char .name{font-weight:700;min-width:0;overflow-wrap:anywhere}
.char .name small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.char.enemy{border-left:4px solid var(--enemy)}
.char.hero{border-left:4px solid var(--hero)}
.dice{grid-column:1 / -1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.dice .lbl{grid-column:1 / -1;font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
@media (max-width:480px){.dice{grid-template-columns:repeat(5,minmax(0,1fr))}}
.die{min-height:38px;width:100%;padding:0;font-size:1.05rem;border-radius:8px;background:var(--bg)}
.die.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Aggiungi personaggio */
.add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;padding:12px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input{width:100%;font:inherit;font-weight:600;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{position:relative;display:flex;align-items:center;justify-content:center;min-height:42px;padding:8px 14px;background:var(--bg);color:var(--muted);font-weight:700;cursor:pointer;font-size:1rem;letter-spacing:0;text-transform:none}
.seg label + label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:-3px}
.seg label.hero:has(input:checked),.seg label.hero.on{background:var(--hero-bg);color:var(--hero)}
.seg label.enemy:has(input:checked),.seg label.enemy.on{background:var(--enemy-bg);color:var(--enemy)}
.seg input:checked + span{text-decoration:underline;text-underline-offset:3px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;overflow-wrap:anywhere}
.errbar{background:var(--enemy-bg);color:var(--enemy);border:1px solid var(--enemy);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.9rem;overflow-wrap:anywhere}
.add .submit{grid-column:1 / -1}
@media (min-width:520px){
  .add{grid-template-columns:minmax(0,1fr) auto auto}
  .add .submit{grid-column:auto}
}
.hint{color:var(--muted);font-size:.85rem;margin-top:10px}

/* Ordine di turno */
.order{display:flex;flex-direction:column;gap:10px}
.group{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:14px;align-items:center;padding:14px 14px 12px;position:relative}
.group .pos{font-family:var(--display);font-size:.9rem;color:var(--muted);width:1.8em;text-align:center}
.group .total{font-family:var(--display);font-size:2rem;line-height:1;min-width:2.2ch;text-align:center}
.group .members{display:flex;flex-wrap:wrap;gap:6px 14px;min-width:0}
.member{display:flex;align-items:center;gap:6px;min-width:0}
.member b{overflow-wrap:anywhere}
.member.hero b{color:var(--hero)}
.member.enemy b{color:var(--enemy)}
.group.tie{background:var(--tie)}
.group.active{background:var(--active);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.group.done{background:var(--done);opacity:.55}
.badge{position:absolute;top:-9px;right:12px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.group.active .badge{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badge.tie-badge{right:auto;left:12px}
.group.active .badge.tie-badge{background:var(--surface);color:var(--muted);border-color:var(--line)}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-style:italic}
.waiting{margin-top:14px;color:var(--muted);font-size:.9rem}
.waiting b{color:var(--fg)}
.finished{padding:14px;text-align:center;font-weight:700;border-style:dashed}

@media (prefers-reduced-motion:no-preference){
  .group{transition:background .2s,opacity .2s}
}
</style>
</head>
<body>

<div id="splash" class="splash" hidden>
  <div class="splash-box">
    <div class="logo-box">
      <img id="splashLogo" class="logo" src="" alt="">
      <div class="tools big">Tools</div>
    </div>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="face">😢</div>
    <h3 id="modalTitle">Vuoi davvero eliminare questo eroe?</h3>
    <p id="modalText"></p>
    <div class="btns">
      <button type="button" id="modalCancel">Annulla</button>
      <button type="button" class="del" id="modalOk">Sì, elimina</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="errbar" class="errbar" hidden></div>

        <button id="btnClearRolls" type="button">Azzera i tiri</button>
      </div>
      <div class="order" id="order"></div>
      <div class="waiting" id="waiting" hidden></div>
    </section>
  </div>
</div>

<script>
(function(){
  // Se qualcosa va storto, mostra l'errore in cima alla pagina invece di fallire in silenzio.
  window.addEventListener('error', function(e){
    var b = document.getElementById('errbar'); if(!b) return;
    b.textContent = 'Errore nella pagina: ' + (e.message || e.error || 'sconosciuto'); b.hidden = false;
  });
  var KEY = 'iniziativa-v4';
  var MAX = 10;
  // Personaggi di partenza (il gruppo)
  var EXAMPLES = [];
  var state = {chars:[], round:1, turn:0, nextId:8};

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var s = JSON.parse(raw); if(s && Array.isArray(s.chars)){ state = s; return; } }
    }catch(e){}
    state.chars = EXAMPLES.map(function(c){ return Object.assign({},c); });
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  var $ = function(id){ return document.getElementById(id); };
  var charList=$('charList'), orderEl=$('order'), waitingEl=$('waiting'), roundNum=$('roundNum');
  var btnNext=$('btnNext'), btnNewRound=$('btnNewRound'), btnClearRolls=$('btnClearRolls');

  function kindName(k){ return k==='enemy' ? 'Nemico' : 'Eroe'; }

  // Raggruppa i personaggi che hanno un valore, dal più alto al più basso.
  function groups(){
    var map = {};
    state.chars.forEach(function(c){
      if(c.value==null) return;
      (map[c.value] = map[c.value] || []).push(c);
    });
    return Object.keys(map).map(Number).sort(function(a,b){ return b-a; })
      .map(function(t){ return {total:t, members:map[t]}; });
  }

  function el(tag, cls, text){
    var e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e;
  }

  function renderChars(){
    charList.textContent = '';
    if(!state.chars.length){
      charList.appendChild(el('div','card empty','Nessun personaggio. Aggiungine uno qui sotto.'));
      return;
    }
    state.chars.forEach(function(c){
      var row = el('div','card char '+(c.kind==='enemy'?'enemy':'hero'));
      var name = el('div','name'); name.appendChild(document.createTextNode(c.name));
      name.appendChild(el('small','num', c.value==null ? 'In attesa del tiro' : 'Iniziativa '+c.value));
      row.appendChild(name);

      // Chip Eroe/Nemico: toccandolo si cambia tipo.
      var bKind = el('button','kind '+(c.kind==='enemy'?'enemy':'hero'), kindName(c.kind)); bKind.type='button';
      bKind.title='Cambia in '+(c.kind==='enemy'?'Eroe':'Nemico');
      bKind.addEventListener('click', function(){ c.kind = (c.kind==='enemy') ? 'hero' : 'enemy'; commit(); });
      row.appendChild(bKind);

      var bDel = el('button','icon danger','✕'); bDel.type='button'; bDel.title='Togli '+c.name; bDel.setAttribute('aria-label',bDel.title);
      bDel.addEventListener('click', function(){
        if(c.kind==='enemy') removeChar(c);
        else askRemove(c);
      });
      row.appendChild(bDel);

      // Quadrati da 1 a 10: tocchi il totale che il giocatore ha detto.
      var dice = el('div','dice'); dice.setAttribute('role','group'); dice.setAttribute('aria-label','Iniziativa di '+c.name);
      dice.appendChild(el('span','lbl','Iniziativa'));
      for(var v=1; v<=MAX; v++){
        (function(v){
          var b = el('button','die num', v); b.type='button'; b.id='die-'+c.id+'-'+v;
          if(c.value===v){ b.classList.add('on'); b.setAttribute('aria-pressed','true'); }
          else b.setAttribute('aria-pressed','false');
          b.title = c.name+': iniziativa '+v;
          b.addEventListener('click', function(){ c.value = (c.value===v) ? null : v; commit(); });
          dice.appendChild(b);
        })(v);
      }
      row.appendChild(dice);
      charList.appendChild(row);
    });
  }

  function renderOrder(){
    orderEl.textContent = '';
    var gs = groups();
    var waiting = state.chars.filter(function(c){ return c.value==null; });

    if(!gs.length){
      orderEl.appendChild(el('div','card empty', state.chars.length ? 'Segna le iniziative per vedere l’ordine di turno.' : 'Aggiungi i personaggi per iniziare.'));
    }
    if(state.turn > gs.length) state.turn = gs.length;

    gs.forEach(function(g, i){
      var card = el('div','card group');
      if(g.members.length>1) card.classList.add('tie');
      if(i < state.turn) card.classList.add('done');
      if(i === state.turn) card.classList.add('active');
      card.appendChild(el('div','pos num', (i+1)+'º'));
      card.appendChild(el('div','total num', g.total));
      var mem = el('div','members');
      g.members.forEach(function(c){
        var m = el('div','member '+(c.kind==='enemy'?'enemy':'hero'));
        m.appendChild(el('b',null,c.name));
        m.appendChild(el('span','kind '+(c.kind==='enemy'?'enemy':'hero'), kindName(c.kind)));
        mem.appendChild(m);
      });
      card.appendChild(mem);
      if(i === state.turn) card.appendChild(el('span','badge', g.members.length>1 ? 'Tocca a loro' : 'È il suo turno'));
      else if(i < state.turn) card.appendChild(el('span','badge','Fatto'));
      if(g.members.length>1) card.appendChild(el('span','badge tie-badge','Pari: agiscono insieme'));
      orderEl.appendChild(card);
    });

    if(gs.length && state.turn >= gs.length){
      orderEl.appendChild(el('div','card finished','Round '+state.round+' finito. Premi "Nuovo round".'));
    }

    if(waiting.length && gs.length){
      waitingEl.hidden = false; waitingEl.textContent = '';
      waitingEl.appendChild(document.createTextNode('Devono ancora tirare: '));
      waitingEl.appendChild(el('b',null, waiting.map(function(c){return c.name;}).join(', ')));
    } else waitingEl.hidden = true;

    roundNum.textContent = state.round;
    btnNext.disabled = !gs.length || state.turn >= gs.length;
    btnClearRolls.disabled = !gs.length;
  }

  function removeChar(c){
    state.chars = state.chars.filter(function(x){ return x.id!==c.id; }); commit();
  }
  // Finestra di conferma (il browser dentro l'artifact non mostra i popup normali).
  var pending = null;
  function askRemove(c){
    pending = c;
    $('modalText').textContent = c.name + ' lascerà il gruppo per sempre.';
    $('modal').hidden = false;
    $('modalCancel').focus();
  }
  function closeModal(){ $('modal').hidden = true; pending = null; }
  $('modalCancel').addEventListener('click', closeModal);
  $('modalOk').addEventListener('click', function(){ if(pending) removeChar(pending); closeModal(); });
  $('modal').addEventListener('click', function(e){ if(e.target===$('modal')) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !$('modal').hidden) closeModal(); });

  function render(){ renderChars(); renderOrder(); }
  function commit(){ save(); render(); }

  btnNext.addEventListener('click', function(){ state.turn += 1; commit(); });
  btnNewRound.addEventListener('click', function(){
    state.round += 1; state.turn = 0;
    state.chars.forEach(function(c){ c.value = null; });
    commit();
  });
  $('btnResetRound').addEventListener('click', function(){
    state.round = 1; state.turn = 0;
    state.chars.forEach(function(c){ c.value = null; });
    commit();
  });
  btnClearRolls.addEventListener('click', function(){
    state.turn = 0; state.chars.forEach(function(c){ c.value = null; }); commit();
  });

  var toastTimer = null;
  function toast(msg){
    var t = $('toast'); if(!t) return;
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, 1600);
  }
  // Su iPhone, con la tastiera aperta, il primo tocco su un pulsante chiude la tastiera e il click si perde.
  // Qui il pulsante risponde direttamente al tocco.
  function onTap(elm, fn){
    var touched = false;
    elm.addEventListener('touchstart', function(e){ touched = true; e.preventDefault(); fn(); }, {passive:false});
    elm.addEventListener('click', function(){ if(touched){ touched = false; return; } fn(); });
  }
  function addChar(){
    var name = $('newName').value.trim();
    if(!name){ toast('Scrivi prima il nome'); $('newName').focus(); return; }
    var kind = $('kindEnemy').checked ? 'enemy' : 'hero';
    state.chars.push({id: state.nextId++, name:name, kind:kind, value:null});
    $('newName').value='';
    commit();
    toast('Aggiunto: ' + name + ' (' + kindName(kind) + ')');
  }
  function syncKind(){
    var enemy = $('kindEnemy').checked;
    $('kindHero').parentNode.classList.toggle('on', !enemy);
    $('kindEnemy').parentNode.classList.toggle('on', enemy);
  }
  $('kindHero').addEventListener('change', syncKind);
  $('kindEnemy').addEventListener('change', syncKind);
  onTap($('kindHero').parentNode, function(){ $('kindHero').checked = true; syncKind(); });
  onTap($('kindEnemy').parentNode, function(){ $('kindEnemy').checked = true; syncKind(); });
  onTap($('btnAdd'), addChar);
  $('newName').addEventListener('keydown', function(e){
    if(e.key==='Enter' || e.keyCode===13){ e.preventDefault(); addChar(); }
  });

  // Schermata iniziale con il logo: sparisce da sola dopo un attimo, o al tocco.
  function showSplash(){
    var sp = $('splash'); if(!sp) return;
    $('splashLogo').src = $('logo').src;
    sp.hidden = false;
    var closing = false;
    function close(){
      if(closing) return; closing = true;
      sp.classList.add('out');
      setTimeout(function(){ sp.hidden = true; }, 520);
    }
    sp.addEventListener('click', close);
    setTimeout(close, 1800);
  }

  function start(data){
    var hot = !!(data && data.chars);
    if(hot) state = data; else load();
    render();
    if(!hot) showSplash();
  }
  if(window.claude && window.claude.hot){
    if(window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return state; });
    if(window.claude.hot.ready) window.claude.hot.ready(start); else start(window.claude.hot.data);
  } else start(null);
})();
</script>
</body>
</html>
